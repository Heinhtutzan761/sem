name: Build and Test

on:
  push:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package

      - name: Check source and compiled files
        run: |
          echo "=== JAVA SOURCE FILES ==="
          find src -type f -name "*.java" -print

          echo "=== APP.JAVA ==="
          cat src/main/java/com/napier/sem/App.java

          echo "=== COMPILED FILES ==="
          find target/classes -type f -print

      - name: Check JAR files
        run: |
          echo "=== TARGET FILES ==="
          ls -lh target/

      - name: Build Docker Image
        run: docker build --no-cache -t devopsimage .

      - name: Run image
        run: docker run --network se-methods --name devopscontainer devopsimage

      - name: View logs
        if: always()
        run: docker logs devopscontainer
