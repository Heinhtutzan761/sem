name: Build and Test

on: push

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Docker network
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo

      - name: Build with Maven
        run: mvn clean package
      - name: Check Java source
        run: |
          echo "=== JAVA FILES ==="
          find . -name "App.java" -type f

          echo "=== COMPILED CLASSES ==="
          find target/classes -type f
      - name: Check Java source and compiled files
        run: |
          echo "=== App.java ==="
          find . -name "App.java" -type f -print

          echo "=== ALL JAVA FILES ==="
          find . -name "*.java" -type f -print

          echo "=== COMPILED FILES ==="
          find target/classes -type f -print
          
      - name: Check JAR files
        run: |
            echo "=== TARGET FILES ==="
             ls -lh target/
      - name: Check Dockerfile
        run: |
          echo "=== DOCKERFILE ==="
          cat Dockerfile

          echo "=== TARGET ==="
          ls -lh target/

          echo "=== APP CLASS ==="
          find target/classes -type f | grep "App.class"
          
      - name: Build Docker Image
        run: docker build --no-cache -t devopsimage .
          
      - name: Run image
        run: docker run --network se-methods --name devopscontainer devopsimage

      - name: View logs
        if: always()
        run: docker logs devopscontainer
