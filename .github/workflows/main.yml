name: A workflow for my Hello World App
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up JDK 25
        uses: actions/setup-java@v2
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package

      - name: Create Docker Network
        run: docker network create se-methods

      - name: Run MongoDB
        run: docker run --name mongo-dbserver --network se-methods -d mongo:latest

      - name: Build Docker Image
        run: docker build -t devopsimage .

      - name: Run image
        run: docker run --name devopscontainer --network se-methods -d devopsimage

      - name: View logs
        run: docker logs devopscontainer
