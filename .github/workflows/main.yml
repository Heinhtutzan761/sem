name: Build and Test

on: push

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Docker network
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo

      - name: Build with Maven
        run: mvn clean package

      - name: Check JAR files
        run: |
            echo "=== TARGET FILES ==="
             ls -lh target/

      - name: Build Docker Image
        run: docker build --no-cache -t devopsimage .
      - name: Inspect Docker Image
        run: |
          docker run --rm --entrypoint sh devopsimage -c "ls -lh /tmp"
          docker run --rm --entrypoint sh devopsimage -c "jar tf /tmp/semethoda-1.0-SNAPSHOT-jar-with-dependencies.jar | grep 'com/napier/sem/App.class'"
          
      - name: Run image
        run: docker run --network se-methods --name devopscontainer devopsimage

      - name: View logs
        if: always()
        run: docker logs devopscontainer
